[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "literature-agent"
version = "0.8.0"
description = "Local-first assistant for literature discovery and screening"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pypdf>=4,<7",
    "openai>=1.40,<4",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "fonttools>=4.69.1,<5"
]

[project.optional-dependencies]
web = ["streamlit>=1.40,<2"]
dev = ["pytest>=8", "streamlit>=1.40,<2"]

[project.scripts]
litagent = "literature_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
